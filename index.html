<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <header>
        <div class="container">
            <img class="profile-avatar" id="avatar" src="https://via.placeholder.com/180x180" alt=".">
            <h1 class="profile-name" id="name"></h1>
            <h2 class="profile-username" id="login"></h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span id="repos"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="followers"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="following"></span>
                </li>
            </ul>
            <a href="#" id="profile-link" class="profile-link">Ver no Github</a>
        </div>
    </header>
    <script src="jquery.js"></script>
    <script>
        $(document).ready(function () {
            const avatarElement = $('#avatar');
            const nameElement = $('#name');
            const loginElement = $('#login');
            const followersElement = $('#followers');
            const reposElement = $('#repos');
            const floowingElement = $('#following');
            const linProfileElement = $('#profile-link')

            const apiGit = `https://api.github.com/users/sidilara`;

            fetch(apiGit)
                .then(function (res) {
                    return res.json();
                })
                .then(function (json) {
                    $(avatarElement).attr('src', json.avatar_url);
                    $(nameElement).append(json.name);
                    $(loginElement).append(`@${json.login}`);
                    $(followersElement).append(json.followers);
                    $(reposElement).append(json.public_repos);
                    $(floowingElement).append(json.following);
                    $(linProfileElement).attr('href', json.html_url)
                })
        })
    </script>
</body>

</html>
