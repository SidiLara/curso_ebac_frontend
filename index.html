<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./main.css">
</head>


<body>
    
    <div class="row container">
        <div class="col">
            <h2>Formulário</h2>
            <form class="form bs-form">
                <label class="form-label" for="name">Nome:</label>
                <input class="form-control" type="text" name="nome" id="nome" required>
                <label class="form-label" for="email">E-mail:</label>
                <input class="form-control" type="email" name="email" id="email" required>
                <label class="form-label" for="telefone">Telefone:</label>
                <input class="form-control" type="number" name="telefone" id="telefone" required>
                <div class="form-check form-switch">
                    <label class="form-check-label" for="aceito-os-termos">Li e concordo com os <mark>termos</mark></label>
                    <input class="form-check-input" type="checkbox" id="aceito-os-termos" name="aceito-os-termos">
                </div>
                <button class="btn btn-warning" type="submit">Enviar</button>
            </form>
        </div>
    </div>
</body>

</html>
